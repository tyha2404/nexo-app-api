name: Deploy Nexo API (Go)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Environment
        shell: bash
        run: |
          echo "=== Deploy API Info ==="
          echo "User: $(whoami)"
          echo "Go: $(go version)"
          echo "PM2: $(pm2 -v)"

      - name: Download Dependencies & Build Go Binary
        shell: bash
        run: |
          go mod download
          mkdir -p bin
          go build -ldflags="-w -s" -o bin/server cmd/server/main.go
          chmod +x bin/server

      - name: Deploy / Reload PM2
        shell: bash
        run: |
          pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
          pm2 save
