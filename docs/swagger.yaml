  handler.RepaymentResponse:
    properties:
      data:
        $ref: '#/definitions/dto.DebtResponse'
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
  model.AllocationPreset:
    enum:
    - "50_30_20"
    - 6_JARS
    - CUSTOM
    type: string
    x-enum-varnames:
    - AllocationPreset503020
    - AllocationPreset6Jars
    - AllocationPresetCustom
  model.Category:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      description:
        type: string
      excludeFromAverageDaily:
        type: boolean
      id:
        type: string
      name:
        type: string
      type:
        $ref: '#/definitions/model.CategoryType'
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/model.User'
      userId:
        type: string
    type: object
  model.CategoryType:
    enum:
    - INCOME
    - EXPENSE
    - INVESTMENT
    type: string
    x-enum-varnames:
    - CategoryTypeIncome
    - CategoryTypeExpense
    - CategoryTypeInvestment
  model.Cost:
    properties:
      amount:
        type: number
      category:
        $ref: '#/definitions/model.Category'
      categoryId:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      incurredAt:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/model.User'
      userId:
        type: string
    required:
    - amount
    - currency
    - incurredAt
    - title
    type: object
  model.DebtStatus:
    enum:
    - PENDING
    - COMPLETED
    - OVERDUE
    type: string
    x-enum-varnames:
    - DebtStatusPending
    - DebtStatusCompleted
    - DebtStatusOverdue
  model.DebtType:
    enum:
    - PAYABLE
    - RECEIVABLE
    type: string
    x-enum-comments:
      DebtTypePayable: Tôi nợ
      DebtTypeReceivable: Người khác nợ tôi
    x-enum-varnames:
    - DebtTypePayable
    - DebtTypeReceivable
  model.Repayment:
    properties:
      amount:
        type: number
      createdAt:
        type: string
      debtId:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      notes:
        type: string
      paidAt:
        type: string
      updatedAt:
        type: string
      walletId:
        type: string
    type: object
  model.StatementStatus:
    enum:
    - UNPAID
    - PARTIALLY_PAID
    - PAID
    - OVERDUE
    type: string
    x-enum-varnames:
    - StatementStatusUnpaid
    - StatementStatusPartiallyPaid
    - StatementStatusPaid
    - StatementStatusOverdue
  model.User:
    properties:
      createdAt:
        type: string
      deletedAt:
        description: |-
          Users intentionally stay HARD-delete (plain *time.Time, not gorm.DeletedAt):
          deleting a user must cascade to all owned rows via FK ON DELETE CASCADE, and
          the Supabase sync trigger re-inserts by id / unique email.
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
      updatedAt:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - username
    type: object
  model.WalletType:
    enum:
    - CASH
    - BANK
    - E_WALLET
    - SAVINGS
    - CREDIT
    - JAR
    type: string
    x-enum-varnames:
    - WalletTypeCash
    - WalletTypeBank
    - WalletTypeEWallet
    - WalletTypeSavings
    - WalletTypeCredit
    - WalletTypeJar
  response.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: Nexo API documentation
  title: Nexo API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the authenticated user's password after verifying the current
        one. Accounts that sign in through Supabase Auth must change it there.
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload, wrong current password or unchanged
            password
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "409":
          description: Password is managed by Supabase Auth
          schema:
            type: string
        "500":
          description: Failed to change password
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user with email and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Invalid request payload
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Failed to process login
          schema:
            type: string
      summary: Login a user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Invalid request payload
          schema:
            type: string
        "500":
          description: Failed to create user
          schema:
            type: string
      summary: Register a new user
